name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev gates
        run: python -m pip install --upgrade pip coverage==7.17.2 ruff==0.15.15
      - name: Smoke, tests, coverage, adversarial, audit, E2E, lint
        run: bash scripts/ci.sh
      - name: Red team suite
        run: python redteam/run_all.py

  windows:
    name: Windows launcher (PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: start.ps1 parse test (pwsh available on the runner)
        run: python -m unittest tests.test_start_ps1 -v

  architecture:
    name: Import contracts and audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the secret scan can inspect every commit.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install audit tools
        run: python -m pip install --upgrade pip pip-audit==2.7.1 mypy==1.10.1
      - name: Import contracts
        run: python -m unittest tests.test_import_contracts -v
      - name: Type-check critical modules (blocking)
        run: >
          python -m mypy --config-file pyproject.toml --follow-imports=skip
          crypto.py session_auth.py runtime_core.py permissions.py hooks.py
          mcp_client.py agent_runs.py agent_loop.py config_schema.py
      - name: Type-check baseline (global ratchet, non-blocking)
        run: python -m mypy .
        continue-on-error: true
      - name: Dependency audit (blocking)
        run: python -m pip_audit -r requirements-dev.txt --progress-spinner off
      - name: Secret scan (working tree + history)
        run: python scripts/secret_scan.py --history
      - name: Generate release evidence (SBOM + RAG baseline)
        run: |
          python scripts/generate_sbom.py --output dist/sbom.json
          python scripts/evaluate_rag.py --output dist/rag_eval.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: dist/
          if-no-files-found: error
