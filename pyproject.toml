# Bonsai Portable — configuración de herramientas

[tool.ruff]
# Solo código del proyecto; nunca dependencias ni artefactos
extend-exclude = [
    ".venv",
    "archive",
    "web",
    "docs",
    "workspace",
    "data",
    "models",
    "audit_data",
]

[tool.ruff.lint]
# Curado: imports sin usar, shadowing (F811), nombres no definidos (F821),
# variables muertas (F841), nulls mal escritos, bare except, statements
# múltiples por línea y f-strings sin placeholders.
select = [
    "F401",
    "F541",
    "F811",
    "F821",
    "F841",
    "E711",
    "E712",
    "E722",
    "E701",
    "E702",
    "E703",
    "B",
]

[project]
name = "bonsai-portable"
version = "1.0.0rc5"
description = "Local-first, stdlib-only portable AI agent runtime"
requires-python = ">=3.11.4"
license = { text = "MIT" }

[tool.mypy]
# Pragmatic baseline, not a strict-typing claim. Tighten per module over time.
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = [
  "^\\.venv/",
  "^archive/",
  "^build/",
  "^dist/",
  "^data/",
  "^workspace/",
]

[[tool.mypy.overrides]]
# Legacy modules are kept for reference and are not on the production path.
module = ["knowledge_db", "linter", "agentportable", "execution_loop"]
ignore_errors = true


[tool.coverage.run]
branch = true
source = ["."]
omit = [
  ".venv/*",
  "tests/*",
  "audit_suite/*",
  "archive/*",
  "web/*",
  "scripts/*",
  "knowledge_db.py",
  "linter.py",
  "agentportable.py",
  "execution_loop.py",
  "snapshot_from_db.py",
  "distill.py",
]

[tool.coverage.report]
fail_under = 63
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
